services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bus_booking}
      POSTGRES_USER: ${POSTGRES_USER:-bus_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bus_local_password}
      TZ: Asia/Kolkata
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bus_app} -d ${POSTGRES_DB:-bus_booking}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bus_booking}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bus_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bus_local_password}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-owner@ssram.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-ChangeThisOwner123!}
      BOOKING_HOLD_MINUTES: 10
      TZ: Asia/Kolkata
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: