spring.application.name=route-rail-api
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bus_booking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bus_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bus_local_password}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.jackson.default-property-inclusion=non_null
server.error.include-message=always
booking.hold-minutes=10
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}